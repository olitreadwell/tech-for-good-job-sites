# Grouped so a normal week produces one PR per upgrade class instead of ten.
# Majors stay ungrouped and unmerged: scripts/dependabot-auto-merge.mjs only
# enables auto-merge for patch and minor bumps that are old enough to trust.
version: 2
updates:
  - package-ecosystem: 'pip'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Pacific/Auckland'
    open-pull-requests-limit: 5
    labels: ['dependencies']
    groups:
      python-patch:
        patterns: ['*']
        update-types: ['patch']
      python-minor:
        patterns: ['*']
        update-types: ['minor']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Pacific/Auckland'
    open-pull-requests-limit: 5
    labels: ['dependencies']
    groups:
      github-actions:
        patterns: ['*']
