name: Dependabot release-age sweep

# A Dependabot pull request may open before its releases are old enough.
# The open event alone never gives it auto-merge in that case.
# This twice-weekly sweep re-checks every open Dependabot pull request.
# Each one then matures into auto-merge on its own.
on:
  schedule:
    - cron: '0 15 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sweep:
    name: Enable auto-merge for matured updates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Sweep open Dependabot PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIN_AGE_DAYS: 3
          REQUIRE_GREEN_CHECKS: 'true'
        run: |
          for url in $(gh pr list --state open --app dependabot --json url -q '.[].url'); do
            node scripts/dependabot-auto-merge.mjs "$url" || echo "sweep: error on $url"
          done
